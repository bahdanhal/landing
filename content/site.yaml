process:
    -
        id: step-1
        title:
            en: 'Discovery & Clear Scope'
            pl: 'Rozpoznanie i precyzyjny zakres'
        text:
            en: 'We discuss your exact business goals and requirements directly (no sales middlemen). We identify potential edge cases and agree on deliverables.'
            pl: 'Rozmawiamy bezpośrednio o celach biznesowych i wymaganiach technicznych (bez pośredników). Określamy kluczowe funkcje i wykluczamy niespodzianki.'
    -
        id: step-2
        title:
            en: 'Architecture & Fixed Estimate'
            pl: 'Architektura i stała wycena'
        text:
            en: 'You receive a clear technical plan, transparent price estimate, and milestone deadlines. You know exactly what will be delivered and when.'
            pl: 'Otrzymujesz przejrzysty plan techniczny, stałą wycenę i harmonogram etapów. Wiesz dokładnie, co i kiedy zostanie dostarczone.'
    -
        id: step-3
        title:
            en: 'Milestone Delivery & Demos'
            pl: 'Etapowa realizacja i demo'
        text:
            en: 'Development proceeds in clear milestones with interactive staging previews. You see real working software and can provide feedback early.'
            pl: 'Prace przebiegają w przejrzystych etapach z podglądem na środowisku testowym (staging). Widzisz działające oprogramowanie i masz bieżący wpływ.'
    -
        id: step-4
        title:
            en: 'Production Launch & Warranty'
            pl: 'Wdrożenie i gwarancja'
        text:
            en: 'Zero-downtime deployment, DNS/SSL setup, analytics, and a 30-day post-launch warranty with ongoing support options.'
            pl: 'Publikacja na serwerze produkcyjnym bez przerw w działaniu, konfiguracja domeny/SSL oraz 30-dniowa gwarancja z opcją stałego wsparcia.'
faq:
    -
        id: faq-1
        question:
            en: 'How long does a typical project take to complete?'
            pl: 'Ile trwa realizacja projektu?'
        answer:
            en: 'A custom high-performance website or landing page typically takes 1 to 2 weeks. Custom web applications, e-commerce platforms, or AI integrations take 3 to 6 weeks depending on scope. Clear milestone dates are established before work begins.'
            pl: 'Strona internetowa lub szybki landing page zwykle zajmuje od 1 do 2 tygodni. Dedykowana aplikacja, sklep internetowy lub integracja AI zajmuje od 3 do 6 tygodni, zależnie od zakresu. Harmonogram ustalamy przed rozpoczęciem prac.'
    -
        id: faq-2
        question:
            en: 'What are your payment terms and invoicing?'
            pl: 'Jak wyglądają rozliczenia i umowa?'
        answer:
            en: 'Projects are structured around milestones (typically 30-50% upfront, remainder upon final demo and deployment approval). Official B2B invoices (Faktura VAT / EU Reverse Charge) are issued with transparent payment terms.'
            pl: 'Pracujemy w oparciu o etapy (zazwyczaj 30-50% zaliczki, reszta po prezentacji i akceptacji wdrożenia). Wystawiam faktury VAT (B2B) z przejrzystymi warunkami płatności.'
    -
        id: faq-3
        question:
            en: 'Do you provide post-launch maintenance and technical support?'
            pl: 'Czy oferujesz wsparcie po wdrożeniu projektu?'
        answer:
            en: 'Yes. Every completed project includes a 30-day warranty for any bugs or adjustments. For ongoing server monitoring, security updates, and incremental feature development, flexible monthly retainer packages are available.'
            pl: 'Tak. Każdy projekt objęty jest 30-dniową bezpłatną gwarancją na poprawki. Dostępne są również elastyczne pakiety stałej opieki technicznej, monitoringu serwera i rozwoju nowych funkcji.'
    -
        id: faq-4
        question:
            en: 'Can you take over or modernize an existing project?'
            pl: 'Czy możesz przejąć lub zmodernizować istniejący projekt?'
        answer:
            en: 'Yes. I frequently audit, optimize, and modernize existing PHP (Symfony, Laravel, WordPress) codebases and legacy applications, fixing performance bottlenecks without risky full rewrites.'
            pl: 'Tak. Regularnie audytuję, przyspieszam i modernizuję istniejące aplikacje PHP (Symfony, Laravel, WordPress), usuwając wąskie gardła wydajnościowe bez konieczności ryzykownego pisania wszystkiego od nowa.'
