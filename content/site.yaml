            pl: '13 sesji w cztery dni (4-7 października), nie licząc tej.'
ai_ideas:
    -
        id: ideas-1
        title:
            en: 'From your own pain.'
            pl: 'Z własnego bólu.'
        text:
            en: "'How can there be no completed audits if I ran them myself on my own pages?' - that question ended in fixes to your own analytics bundle. OBD Vault grew next to the diagnosis of a fault in your own Citroen."
            pl: "'Jak to nie ma ukończonych audytów, skoro sam je uruchamiałem na swoich stronach?' - to pytanie skończyło się poprawkami w Twoim własnym pakiecie analityki. OBD Vault wyrósł obok diagnozy usterki w Twoim Citroenie."
    -
        id: ideas-2
        title:
            en: 'From gaps in the ecosystem.'
            pl: 'Z dziur w ekosystemie.'
        text:
            en: "'Check which PHP CMSs still have no MCP plugins' led to bolt-mcp. A question about the PHP SDK for Azure that Microsoft dropped led to a post and an idea for a contribution."
            pl: "'Sprawdź, które CMS-y w PHP nie mają jeszcze wtyczek MCP' doprowadziło do bolt-mcp. Pytanie o porzucony przez Microsoft PHP SDK dla Azure - do wpisu i pomysłu na kontrybucję."
    -
        id: ideas-3
        title:
            en: 'From your own incidents.'
            pl: 'Z własnych incydentów.'
        text:
            en: "The question 'so BIMI is basically an avatar for email?' became an article on the StackHal blog."
            pl: "Pytanie 'czyli BIMI to w zasadzie awatar dla poczty?' stało się artykułem na blogu StackHal."
    -
        id: ideas-4
        title:
            en: 'With a check before starting.'
            pl: 'Ze sprawdzeniem przed startem.'
        text:
            en: "'Search the internet to see if I reinvented the wheel' and 'can you verify the idea?' come before the browser extension and before OBD."
            pl: "'Poszukaj w internecie, czy nie wynalazłem koła na nowo' i 'możesz zweryfikować pomysł?' padają przed rozszerzeniem do przeglądarki i przed OBD."
    -
        id: ideas-5
        title:
            en: 'Through experiment.'
            pl: 'Przez eksperyment.'
        text:
            en: 'You had the Polish copy scored for readability the way English text is scored, with one more test on top: it has to make sense to a Polish teacher in a Polish school.'
            pl: 'Kazałeś zmierzyć czytelność polskich tekstów tak, jak mierzy się angielskie, i dodałeś jeszcze jeden test: mają mieć sens dla nauczyciela polskiego w polskiej szkole.'
ai_approach:
    -
        id: approach-1
        title:
            en: 'Short command, long autonomy, control by numbers.'
            pl: 'Krótkie polecenie, długa autonomia, kontrola po liczbach.'
        text:
            en: "After 'continue' comes 'check the stats over MCP' - you have 37 messages about statistics, analytics and logs."
            pl: "Po 'kontynuuj' przychodzi 'sprawdź statystyki przez MCP' - masz 37 wiadomości o statystykach, analityce i logach."
    -
        id: approach-2
        title:
            en: 'You ask to be roasted.'
            pl: 'Prosisz, żeby Cię skrytykować bez litości.'
        text:
            en: "'Roast my sites', 'find the slop', 'was it really right and useful that we dropped the Google pixel?'"
            pl: "'Zjedź moje strony', 'znajdź slop', 'czy to naprawdę słuszne i pożyteczne, że zrezygnowaliśmy z piksela Google?'"
    -
        id: approach-3
        title:
            en: 'You check models against each other.'
            pl: 'Sprawdzasz modele nawzajem.'
        text:
            en: "You paste one agent's review into another agent's chat."
            pl: 'Wklejasz przegląd jednego agenta do rozmowy z drugim.'
    -
        id: approach-4
        title:
            en: 'You delete.'
            pl: Usuwasz.
        text:
            en: 'The confidence field from the code and the database, giant headings from every project, Headroom two weeks after installing it.'
            pl: 'Pole confidence z kodu i bazy, gigantyczne nagłówki ze wszystkich projektów, Headroom dwa tygodnie po instalacji.'
    -
        id: approach-5
        title:
            en: 'You do not let an agent stop for nothing.'
            pl: 'Nie pozwalasz agentowi zatrzymywać się bez powodu.'
        text:
            en: "'Automatic run paused' - 'why on earth?'"
            pl: "'Automatyczne uruchomienie wstrzymane' - 'a niby czemu?'"
    -
        id: approach-6
        title:
            en: 'Taste against the template.'
            pl: 'Gust przeciwko szablonowi.'
        text:
            en: "'Not another AI startup slop', a Polish visual code for IleZa, and the cat and the explosion on StackHal are 'not to be thrown away under any circumstances' - that is post-irony."
            pl: "'Nie kolejny slop startupu AI', polski kod wizualny dla IleZa, a kota i wybuchu na StackHal 'nie wyrzucać pod żadnym pozorem' - to postironia."
    -
        id: approach-7
        title:
            en: 'In your own words:'
            pl: 'Twoimi słowami:'
        text:
            en: "you like tasks of the 'what on earth is this' kind and quests like 'get to place X and reach person Y'."
            pl: "lubisz zadania typu 'co to w ogóle jest' i questy w stylu 'dotrzeć do miejsca X i skontaktować się z Y'."
