ai_activity:
    -
        id: activity-1
        title:
            en: Codex
            pl: Codex
        text:
            en: '225 sessions you started yourself and 1,519 of your messages over 50 active days (25 July - 6 October). About 800 more files are subagents and automatic reviews that the agents launched themselves.'
            pl: '225 sesji, które zacząłeś sam, i 1519 Twoich wiadomości w ciągu 50 aktywnych dni (25 lipca - 6 października). Około 800 kolejnych plików to subagenci i automatyczne przeglądy uruchamiane przez samych agentów.'
    -
        id: activity-2
        title:
