name: Deploy to Production

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

on:
  push:
    branches: [ master ]

jobs:
  test:
    name: Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker Test Image
        run: |
          docker build --target test -t bahdan-landing-test .

      - name: Run PHPUnit Test Suite
        run: |
          docker run --rm --env-file .env.example -e APP_ENV=test bahdan-landing-test vendor/bin/phpunit --fail-on-phpunit-notice

      - name: Run JavaScript Test Suites
        run: |
          docker run --rm -v "$PWD:/app" -w /app node:24-alpine sh -lc 'for test in tests/js/*.test.js; do node "$test" || exit 1; done'

      - name: Run Static and Style Checks
        run: |
          docker run --rm bahdan-landing-test vendor/bin/phpcs
          docker run --rm bahdan-landing-test vendor/bin/phpstan analyse --no-progress --memory-limit=512M
          docker run --rm bahdan-landing-test php bin/console lint:twig templates
          docker run --rm bahdan-landing-test php bin/console lint:yaml translations config
          docker run --rm bahdan-landing-test composer audit --locked --no-interaction

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SSH Key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Rsync Files to Production Server
        run: |
          rsync -az --delete \
            --exclude='.git*' \
            --exclude='.idea' \
            --exclude='.agents' \
            --exclude='.codex' \
            --exclude='.gemini' \
            --exclude='production.env' \
            --exclude='.env.local' \
            --exclude='certbot-webroot' \
            --exclude='var/' \
            ./ "$SSH_USER@$SSH_HOST:/home/bahdan-landing/"

      - name: Rebuild & Restart Production Containers
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            'cd /home/bahdan-landing && docker compose -p seo --env-file production.env up -d --build'

      - name: Health Check Verification
        run: |
          sleep 5
          curl -f -I --retry 3 --retry-delay 2 https://bahdanhal.pl/healthz || exit 1
