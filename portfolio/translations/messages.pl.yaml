    sources:
        title: "Oficjalne źródła 2026"
        text: "Parametry wynikają z aktualnych informacji polskiego rządu i ZUS, sprawdzonych w dniu podanym wyżej."
        health: "składka zdrowotna"
        business: "zdrowotna przedsiębiorcy"
    limitations:
        title: "Sytuacje zmieniające wynik"
        text: "Inne dochody, wspólne rozliczenie, ulga dla młodych, autorskie KUP, PPK, zbieg tytułów, niepełnosprawność, dokładna wypadkowa, roczne rozliczenie zdrowotnej, urlop i właściwa stawka ryczałtu mogą istotnie zmienić wynik."
    disclaimer: "Wyłącznie szacunek informacyjny. Rzeczywistą umowę sprawdź w programie kadrowo-księgowym lub u polskiego specjalisty."
    faq:
        title: "Często zadawane pytania o formy zatrudnienia w Polsce"
        q1: "Czym różnią się formy UoP, UZ, Ud i B2B?"
        a1: "Umowa o pracę (UoP) zapewnia pełne prawa pracownicze i płatny urlop. Umowa zlecenie (UZ) to elastyczna umowa cywilnoprawna ze składkami społecznymi (zwolniona dla studentów do 26 lat). Umowa o dzieło (Ud) dotyczy wykonania określonego dzieła i nie podlega ZUS. B2B to jednoosobowa działalność gospodarcza z bezpośrednim fakturowaniem i możliwością rozliczania kosztów."
        q2: "Dlaczego porównanie wychodzi od budżetu firmy, a nie kwoty brutto?"
        a2: "Punktem wyjścia jest łączny koszt, jaki zleceniodawca lub pracodawca przeznacza na stanowisko. Pozwala to na rzetelne i przejrzyste porównanie kwoty na rękę przy tym samym nakładzie finansowym."
        q3: "Jak działa składka zdrowotna na B2B w 2026 roku?"
        a3: "Na skali podatkowej wynosi 9% dochodu, na podatku liniowym 4.9% dochodu, a na ryczałcie jest zryczałtowaną kwotą zależną od rocznego przedziału przychodów."

