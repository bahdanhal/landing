            title: "Wbudowane Reverse Proxy i PHP"
            text: "Automatyczna obsługa WebSocket, nagłówków X-Forwarded i puli połączeń. Pojedyncza dyrektywa php_fastcgi bezpiecznie obsługuje aplikacje PHP."
        private:
            title: "100% prywatności w przeglądarce"
            text: "Całe parsowanie i konwersja odbywają się lokalnie w Twojej przeglądarce. Żadne domeny, porty ani adresy IP nie są przesyłane na serwer."
    mapping_cheatsheet_title: "Inteligentne mapowanie — dlaczego Caddy jest prostszy"
    cheatsheet_proxy_title: "Reverse Proxy i nagłówki"
    cheatsheet_proxy_desc: "proxy_pass i 5 linii proxy_set_header zamieniają się w pojedyncze reverse_proxy. Host, X-Forwarded-For i WebSockets działają automatycznie."
    cheatsheet_ssl_title: "Automatyczny HTTPS"
    cheatsheet_ssl_desc: "Dyrektywy ssl_certificate są usuwane. Caddy sam pozyskuje, odnawia i konfiguruje certyfikaty TLS (Let's Encrypt / ZeroSSL)."
    cheatsheet_php_title: "Router PHP-FPM"
    cheatsheet_php_desc: "try_files + fastcgi_pass i parametry skryptów są zastępowane przez php_fastcgi i file_server."
    cheatsheet_rewrite_title: "Przejrzyste przekierowania"
    cheatsheet_rewrite_desc: "Skomplikowane wyrażenia regularne RewriteRule tłumaczą się bezpośrednio na czytelne dyrektywy redir."
    faq:
        title: "Często zadawane pytania"
        q1: "Jak przekonwertować konfigurację Nginx na Caddyfile?"
        a1: "Wklej blok server lub dyrektywy location do pola edytora. Transpiler automatycznie rozpozna proxy_pass, fastcgi_pass, try_files, root oraz reguły przepisywania i wygeneruje poprawny Caddyfile dla Caddy v2."
        q2: "Czy mogę przekonwertować plik .htaccess z Apache?"
        a2: "Tak. Wybierz Apache jako serwer źródłowy i wklej reguły .htaccess lub blok <VirtualHost>. Narzędzie przetłumaczy RewriteRule, DirectoryIndex, nagłówki i podstawowe uwierzytelnianie na dyrektywy Caddy."
        q3: "Czy moje pliki konfiguracyjne są wysyłane na serwer?"
        a3: "Nie. Cała konwersja działa w 100% po stronie klienta w przeglądarce w JavaScript. Żadne nazwy domen, porty, wewnętrzne adresy IP ani hasła nie opuszczają Twojego komputera."
        q4: "Jakie dyrektywy Nginx stają się zbędne w Caddy?"
        a4: "Dyrektywy takie jak ssl_certificate, ssl_protocols, proxy_set_header Upgrade czy gzip on są pomijane, ponieważ Caddy zarządza certyfikatami TLS, WebSocketami i kompresją w sposób w pełni automatyczny."

