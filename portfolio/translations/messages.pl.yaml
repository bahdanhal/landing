            title: "O 80% krótsza konfiguracja"
            text: "Czytelna składnia zastępuje zawiłe bloki. HTTP/2, HTTP/3 oraz nowoczesny TLS 1.3 są włączone domyślnie bez dodatkowego tuningu."
