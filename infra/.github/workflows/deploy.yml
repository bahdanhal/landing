name: Deploy Infra Configuration

permissions:
  contents: read

concurrency:
  group: production-infra
  cancel-in-progress: false

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Rsync Infra Files to Production Server
        run: |
          rsync -az \
            --exclude='.git*' \
            --exclude='production.env' \
            ./ "$SSH_USER@$SSH_HOST:/home/apps/infra/"

      - name: Reload Caddy & Up Services
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            'cd /home/apps/infra && chmod +x scripts/*.sh && docker compose -f docker-compose.prod.yml --env-file production.env up -d'
