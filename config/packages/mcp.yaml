mcp:
  app: 'Bahdan’s Toolbox — Polish Used-Price Index'
  version: '1.0.0'
  description: 'Read-only Polish second-hand price snapshots and history for popular Apple products.'
  website_url: 'https://bahdanhal.pl/tools/poland-used-price-index'
  instructions: |
    Use these read-only tools for dated Polish used-goods price estimates. Values are AI-assisted asking-price estimates, not scraped listings or completed sales.
  client_transports:
    http: true
    stdio: true
  http:
    path: '/mcp'
    allowed_hosts: ['bahdanhal.pl', 'www.bahdanhal.pl', 'bahdan-hal.ovh', 'www.bahdan-hal.ovh', 'localhost', '127.0.0.1']
    session:
      store: file
      directory: '%kernel.project_dir%/var/mcp-sessions'
      ttl: 3600
