mcp:
  servers:
    default:
      name: 'Bahdan Hal Portfolio MCP'
      version: '1.2.0'
      description: 'Bahdan Hal software engineering consulting: services and pricing, CV and skills, project overview, and contact requests.'
      website_url: 'https://bahdanhal.pl/'
      instructions: |
        Public tools need no authentication. They provide information on Bahdan's engineering expertise, services and pricing; submit_contact_lead sends a consultation request and should only be called when the user asks to get in touch.
      transports:
        http: true
        stdio: true
      http:
        path: '/mcp'
        allowed_hosts: ['bahdanhal.pl', 'www.bahdanhal.pl', 'bahdan-hal.ovh', 'www.bahdan-hal.ovh', 'localhost', '127.0.0.1']
      session:
        store: file
        directory: '%kernel.project_dir%/var/mcp-sessions'
        ttl: 3600
      registry: '*'
