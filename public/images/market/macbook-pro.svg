<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="mbp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1f"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="mbp-lid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mbp-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mbp-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#mbp-bg)"/>
  <circle cx="320" cy="240" r="180" fill="rgba(56, 189, 248, 0.05)"/>
  <!-- Display Lid -->
  <rect x="130" y="70" width="380" height="250" rx="14" fill="url(#mbp-lid)" stroke="#475569" stroke-width="2"/>
  <!-- Screen Glass -->
  <rect x="142" y="82" width="356" height="226" rx="8" fill="url(#mbp-screen)"/>
  <!-- Notch -->
  <rect x="300" y="82" width="40" height="12" rx="4" fill="#000"/>
  <!-- Screen Graphic (Chip Architecture / Waves) -->
  <circle cx="320" cy="190" r="50" fill="none" stroke="url(#mbp-accent)" stroke-width="3" opacity="0.7"/>
  <rect x="295" y="165" width="50" height="50" rx="10" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="320" y="196" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">PRO</text>
  <!-- Base Chassis -->
  <path d="M 80 326 L 560 326 L 540 348 L 100 348 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="280" y="326" width="80" height="6" rx="3" fill="#0f172a"/>
  <!-- Keyboard & Trackpad Indication Glow -->
  <line x1="120" y1="334" x2="520" y2="334" stroke="#334155" stroke-width="1.5"/>
</svg>
