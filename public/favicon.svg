<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#262421"/>
      <stop offset="100%" stop-color="#0f0f0e"/>
    </linearGradient>

    <!-- Vibrant Orange Arrow Gradient -->
    <linearGradient id="arrow" x1="18" y1="46" x2="46" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3305"/>
      <stop offset="55%" stop-color="#ff5c35"/>
      <stop offset="100%" stop-color="#ff8e70"/>
    </linearGradient>

    <!-- Bevel & Glass Rim Highlight -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff5c35" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="glow" cx="38" cy="26" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5c35" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff5c35" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#ff380d" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    @media (prefers-color-scheme: dark) {
      .badge-bg { fill: #171615; }
      .badge-stroke { stroke: #ff5c35; stroke-opacity: 0.45; stroke-width: 1.5; }
      .core-glow { opacity: 0.9; }
    }
    @media (prefers-color-scheme: light) {
      .badge-bg { fill: #1b1a18; }
      .badge-stroke { stroke: url(#rim); stroke-width: 1.5; }
      .core-glow { opacity: 0.55; }
    }
  </style>

  <!-- Squircle Base -->
  <rect class="badge-bg" x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>

  <!-- Ambient Light -->
  <circle class="core-glow" cx="36" cy="28" r="22" fill="url(#glow)"/>

  <!-- Rim Highlight -->
  <rect class="badge-stroke" x="2" y="2" width="60" height="60" rx="16" stroke="url(#rim)" stroke-width="1.5" fill="none"/>

  <!-- Dynamic Ascending Arrow -->
  <g filter="url(#shadow)">
    <path d="M21 43L43 21M27 21H43V37" fill="none" stroke="url(#arrow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tech Indicator Node -->
  <circle cx="21" cy="21" r="2.5" fill="#ff8e70" opacity="0.95"/>
</svg>

