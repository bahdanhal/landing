name: CI & Quality Gate

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Test Image
        run: docker build --target test -t ileza-test .

      - name: Run PHPUnit Test Suite
        run: docker run --rm --env-file .env.example -e APP_ENV=test ileza-test vendor/bin/phpunit --fail-on-phpunit-notice

      - name: Run JavaScript Test Suites
        run: docker run --rm -v "$PWD:/app" -w /app node:24-alpine sh -lc 'for test in tests/js/*.test.js; do node "$test" || exit 1; done'

      - name: Run PSR-12 Code Style
        run: docker run --rm ileza-test vendor/bin/phpcs

      - name: Run PHPStan Level 8 Analysis
        run: docker run --rm ileza-test vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Lint Twig & YAML
        run: |
          docker run --rm ileza-test php bin/console lint:twig templates
          docker run --rm ileza-test php bin/console lint:yaml translations config

      - name: Composer Validate & Audit
        run: |
          docker run --rm ileza-test composer validate --strict --no-check-publish
          docker run --rm ileza-test composer audit --locked --no-interaction
