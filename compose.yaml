services:
  migrate:
    build:
      context: .
      target: app
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.local or the environment}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-bahdan}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local or the environment}@db:5432/${POSTGRES_DB:-bahdan_toolbox}?serverVersion=17&charset=utf8}
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--allow-no-migration"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.local or the environment}
      AUDIT_MAX_PAGES: ${AUDIT_MAX_PAGES:-40}
      AUDIT_CONCURRENCY: ${AUDIT_CONCURRENCY:-3}
      AUDIT_BATCH_DELAY_MS: ${AUDIT_BATCH_DELAY_MS:-200}
      AUDIT_TIMEOUT_SECONDS: ${AUDIT_TIMEOUT_SECONDS:-12}
      AUDIT_MAX_BODY_BYTES: ${AUDIT_MAX_BODY_BYTES:-2000000}
      AUDIT_CACHE_TTL: ${AUDIT_CACHE_TTL:-21600}
      AUDIT_LOG_DIRECTORY: ${AUDIT_LOG_DIRECTORY:-/app/var/audit-logs}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-14}
      CONTACT_LEAD_DIRECTORY: ${CONTACT_LEAD_DIRECTORY:-/app/var/contact-leads}
      MARKET_DATA_DIRECTORY: ${MARKET_DATA_DIRECTORY:-/app/var/market-data}
      ANALYTICS_DATA_DIRECTORY: ${ANALYTICS_DATA_DIRECTORY:-/app/var/analytics-data}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-90}
      MARKET_ADMIN_TOKEN: ${MARKET_ADMIN_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_SUMMARY_MODEL: ${AI_SUMMARY_MODEL:-claude-haiku-4-5-20251001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-bahdan}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local or the environment}@db:5432/${POSTGRES_DB:-bahdan_toolbox}?serverVersion=17&charset=utf8}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /app/var:size=128m,uid=82,gid=82,mode=0770
    volumes:
      - audit_cache:/app/var/audit-cache
      - audit_logs:/app/var/audit-logs
      - contact_leads:/app/var/contact-leads
      - rate_limits:/app/var/rate-limits
      - market_data:/app/var/market-data
      - analytics_data:/app/var/analytics-data
    networks: [internal]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bahdan_toolbox}
      POSTGRES_USER: ${POSTGRES_USER:-bahdan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local or the environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    read_only: true
    tmpfs:
      - /data:size=32m
      - /config:size=8m
    volumes:
      - "${CERTBOT_WEBROOT:-./certbot-webroot}:/srv/certbot:ro"
      - "${LETSENCRYPT_DIRECTORY:-/etc/letsencrypt}:/etc/letsencrypt:ro"
    networks: [internal]

networks:
  internal:

volumes:
  db_data:
  audit_cache:
  audit_logs:
  contact_leads:
  rate_limits:
  market_data:
  analytics_data:
