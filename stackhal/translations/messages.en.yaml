        vmc: "Apple Mail & Yahoo support self-asserted BIMI; Gmail requires VMC."
        check_domain_link: "Test your domain with Domain Inspector"
    faq:
        title: "Frequently Asked Questions about BIMI"
        q1: "What is BIMI (Brand Indicators for Message Identification)?"
        a1: "BIMI is an email specification enabling organizations to display their official verified brand logo directly next to incoming messages in supporting email inboxes like Gmail, Apple Mail, and Yahoo."
        q2: "Why does BIMI require the SVG Tiny 1.2 PS format?"
        a2: "Mail clients enforce the SVG Tiny Portable/Secure profile for security and performance. It disables JavaScript scripts, external file references, entity expansion, and raster embeds that could pose security risks."
        q3: "Do I need a Verified Mark Certificate (VMC) for BIMI?"
        a3: "Apple Mail and Yahoo support self-asserted BIMI without a certificate. Gmail requires a VMC issued by a recognized certificate authority (DigiCert, Entrust) confirming trademark ownership."

domain_inspector:
    meta:
        title: "Domain Email Security Inspector · DMARC, BIMI, MTA-STS & SPF Checker"
        description: "Instant 1-click domain email security inspection: check DMARC compliance for BIMI, MTA-STS strict transport encryption (RFC 8461), SMTP TLS reporting (RFC 8460), and SPF."
    eyebrow: "EMAIL DELIVERABILITY & SECURITY"
    heading: "Domain Email Security & BIMI Inspector"
    lede: "Verify your domain's email authentication chain in 1 click. Check DMARC compliance for BIMI, MTA-STS strict transport encryption, SMTP TLS reporting, and SPF anti-spoofing."
    title: "Domain Inspector"
    input_label: "Enter domain name to inspect:"
    check_btn: "Inspect Domain"
    examples_label: "Try examples"
    features:
        dmarc:
            title: "DMARC & BIMI Policy"
            text: "Evaluates whether your policy qualifies for BIMI avatars (p=quarantine pct=100 or p=reject) and prevents email spoofing."
        bimi:
            title: "BIMI DNS & Logo Probe"
            text: "Finds default._bimi records, verifies HTTPS reachability, checks content types and SVG Tiny 1.2 profile conformance."
        mta_sts:
            title: "MTA-STS Strict Transport (RFC 8461)"
            text: "Checks for DNS records and queries https://mta-sts.domain/.well-known/mta-sts.txt to enforce TLS delivery."
        tls_rpt:
            title: "SMTP TLS-RPT (RFC 8460)"
            text: "Validates aggregate SMTP TLS reporting records so you receive diagnostic telemetry on delivery failures."
    faq:
        title: "Frequently Asked Questions about Email Deliverability"
        q1: "What DMARC policy is required for BIMI avatars?"
        a1: "BIMI requires an active DMARC policy of at least p=quarantine with pct=100 or p=reject. A policy of p=none is considered observation-only and does not qualify for BIMI logo display."
        q2: "What is MTA-STS (RFC 8461) and why is it important?"
        a2: "Mail Transfer Agent Strict Transport Security (MTA-STS) prevents man-in-the-middle downgrade attacks on SMTP connections by declaring that sending mail servers must use TLS with trusted certificates."
        q3: "How does SMTP TLS-RPT (RFC 8460) help?"
        a3: "TLS Reporting enables sending mail providers to send daily aggregate telemetry reports whenever encryption negotiation fails, identifying routing issues and certificate expiration before mail drops."
    report:
        title: "Email Security Report for %domain% · Bahdan’s Toolbox"
        back: "Inspect another domain"
        score_label: "Deliverability Security Score: %score%/100"
        time_label: "Inspected at %time%"
