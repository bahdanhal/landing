        title: "Interactive Card Emulator"
    actions:
        repack: "Fix & Re-pack .pkpass"
        export_google: "Export Google Wallet JSON"
        download_json: "Download pass.json"
    guide:
        title: "Why iOS Silently Drops .pkpass Files"
        subtitle: "When creating digital passes, iOS rarely shows descriptive error popups — it silently fails to open the pass. Here are the top failure reasons caught by this inspector:"
        manifest_title: "manifest.json SHA-1 Desync"
        manifest_text: "Modifying dates, colors, or barcode messages in pass.json without recomputing its SHA-1 checksum in manifest.json causes iOS to reject the archive immediately as corrupt or tampered."
        dates_title: "Floating Dates Missing Timezones"
        dates_text: "iOS strictly requires all expirationDate and relevantDate strings to follow full ISO 8601 formatting with an explicit timezone offset (e.g. 2026-08-23T14:30:00+02:00 or Z). Floating dates without timezones are rejected."
        assets_title: "Missing Required Assets & Retina Icons"
        assets_text: "Apple Wallet requires icon.png and icon@2x.png (58x58 px) for lock screen notifications. Missing icon files or incorrect aspect ratios will prevent the pass from installing."
        barcodes_title: "Barcode Format & Encoding Errors"
        barcodes_text: "Using unsupported encoding headers or invalid format constants causes iOS barcode rendering failures. Standard encoding should always be utf-8 or iso-8859-1."
    faq:
        title: "Frequently Asked Questions"
        q1: "What is inside an Apple Wallet .pkpass file?"
        a1: "A .pkpass file is a standard ZIP archive containing pass.json (field layouts, colors, dates, barcodes), manifest.json (SHA-1 checksum dictionary of all files), signature (PKCS#7 signature from Apple Developer), and PNG image assets (icon, logo, strip, thumbnail)."
        q2: "Can I test and preview .pkpass files on Android, Windows, or Linux?"
        a2: "Yes! This tool provides a 100% client-side pixel-perfect web emulator that renders Apple Wallet boarding passes, concert tickets, loyalty cards, coupons, and generic passes directly in any modern browser."
        q3: "How does the 'Fix & Re-pack' feature work?"
        a3: "If you edit pass.json or fix broken files, clicking 'Fix & Re-pack' recalculates the SHA-1 checksum for every file in the package, regenerates a valid manifest.json, and downloads a clean, verified .pkpass ZIP bundle."
        q4: "Is my ticket or boarding pass uploaded to your server?"
        a4: "No. All ZIP decompression, SHA-1 cryptographic hashing, PKCS#7 certificate parsing, and canvas/SVG barcode rendering take place 100% locally inside your web browser. Zero ticket data is ever uploaded or stored."

