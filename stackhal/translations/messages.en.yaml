        q1: "What is the difference between UoP, UZ, Ud, and B2B?"
        a1: "Umowa o pracę (UoP) provides standard labour code protections and paid leave with full social security. Umowa zlecenie (UZ) is a civil services contract with social and health contributions (exempt for students under 26). Umowa o dzieło (Ud) is a task/result contract without social contributions. B2B is a sole proprietorship contract where you invoice clients directly and manage business costs and ZUS."
