profile:
    meta:
        title: "Bahdan Hal · Websites, AI integrations, MCP and production support"
        description: "Websites, AI integrations, MCP servers and workflow automation delivered end to end, plus PHP systems, production support and honest technical consulting."
    role_short: "Web & Backend Engineer"
    nav:
        services: "Services"
        work: "Work"
    eyebrow: "WEB PRESENCE · SYSTEMS · PRODUCTION"
    heading: "Web systems"
    heading_emphasis: "built for production."
    intro: "I design, modernize and operate web systems—from focused launches and AI integrations to difficult backend migrations and production incidents. You get direct technical judgment and ownership through delivery."
    scope: "I build and take responsibility for online systems end to end: websites, integrations, AI and MCP-powered tools, from the first honest technical decision through deployment, monitoring and the awkward production incident nobody can reproduce."
    contact: "Free consultation"
    tools: "Open the toolbox"
    facts_label: "Professional summary"
    years: "years in software"
    backend:
        title: "Backend systems"
        text: "Symfony and Laravel applications, legacy migrations, data-heavy workflows, APIs, integrations, queues, and the unglamorous reliability work that keeps them running."
    infrastructure:
        title: "Practical infrastructure"
        text: "Docker, Linux hardening, migrations to cost-effective VPS and bare metal, mail deliverability, incident recovery, and production debugging."
    ai:
        title: "AI, MCP and custom tools"
        text: "AI integrations, MCP servers, APIs, internal tools and workflow automation designed around a real job. I actively use and test these systems myself, so the advice comes from production practice rather than demos alone."
    services:
        eyebrow: "WHAT I CAN TAKE OFF YOUR PLATE"
        title: "One person for the whole technical journey"
        intro: "I can own a focused delivery, join an existing team, or investigate one stubborn problem. You get a direct technical opinion, clear trade-offs and somebody who stays for production."
        presence:
            title: "Online presence"
            text: "A fast bilingual website, landing page, service portal or practical tool with domains, email, analytics choices, SEO foundations and deployment handled together."
        delivery:
            title: "End-to-end delivery"
            text: "Discovery, architecture, backend, integrations, infrastructure, release and handover. No gap between ‘the feature is coded’ and ‘it works for real users’."
        ai_integration:
            title: "AI integrations and MCP servers"
            text: "Model selection, secure tool access, retrieval, structured outputs, MCP servers, agent workflows, evaluation and observability—integrated into an existing product or built as a focused new tool."
        automation:
            title: "Workflow automation and adoption"
            text: "I map repetitive work, prototype the useful part, connect the systems and help the team adopt it. I can consult on what to automate, what to keep human and how to verify the result."
        duty:
            title: "Night migration or deployment duty"
            text: "Careful cutovers, data migrations, rollback plans and live production support when the safest window happens to be at night."
        investigation:
            title: "Strange production mysteries"
            text: "The site stalls on Tuesdays at a random minute between 12:00 and 12:10, the code looks innocent and useful logs do not exist? I instrument, reproduce and follow the evidence."
        legacy:
            title: "Legacy, upgrades and speed"
            text: "Framework and PHP upgrades, dependency recovery, test coverage around risky code, database and cache tuning, and gradual modernization without a reckless rewrite."
        audit:
            title: "Audit with a human touch"
            text: "Architecture, reliability, security, performance, SEO and infrastructure reviewed in context. You get an honest opinion and a prioritised plan, not a ceremonial PDF."
    work:
        eyebrow: "SELECTED EXPERIENCE"
        title: "Recent work"
        freedom: "Backend development and internal agent tooling for a telecommunications platform, including integrations, stability work, and difficult production defects."
        gwo: "Modernised Symfony and Laravel systems used by millions, built editorial and education tools, and integrated generative and vision models into real workflows."
        consulting_title: "Independent consulting"
        consulting: "Linux security, migrations, SMTP deliverability, API integrations, and focused backend work for clients running real systems on practical budgets."
    testimonials:
        title: "What clients say"
        link: "View Upwork profile"
        stars: "5 out of 5 stars"
        rollup: "Rollup build repair"
        transfer: "Overnight Shopware server transfer"
        success: "Job Success on Upwork"
        status: "Top Rated · 28 jobs"
    present: "present"
    contact_eyebrow: "CONTACT"
    contact_heading: "Have a challenge—or simply an interesting idea?"
    consultation:
        eyebrow: "FREE FIRST CONSULTATION"
        title: "Tell me what is happening"
        text: "Leave an email or phone number and a short description. I will tell you honestly whether I can help, what I would check first and whether the problem needs paid work at all. A curious conversation about AI, systems or an unusual idea is welcome too."
        one: "No mailing list and no sales sequence."
        two: "Five submissions per connection per day, honeypot protection and hashed IP addresses."
        three: "A link and two sentences are usually enough to start."
        four: "No polished project brief is required; I am always happy to discuss an interesting technical idea."
    socials: "Contact and profiles"
    summit_alt: "Bahdan Hal on a mountain summit"
    summit_eyebrow: "RESILIENCE & PREPARATION"
    summit_caption: "Calm in production, whatever the scale."
    summit_subtext: "Whether on the trail or in backend architecture, what matters is thorough preparation, simplicity, and resilience under pressure."
    faq:
        title: "Frequently asked questions"
        q1: "What backend stack and technologies do you specialise in?"
        a1: "My focus is PHP (Symfony, Laravel), PostgreSQL, MySQL, Redis, Linux systems, Docker containerisation, and deterministic or agentic AI integrations."
        q2: "What collaboration models and projects do you take on?"
        a2: "I take focused fixes, audits, migrations and integrations as well as end-to-end website or tool delivery. I can work independently or alongside an existing team on B2B terms."
        q3: "Is the first consultation really free?"
        a3: "Yes. The first conversation and an honest initial assessment are free. If the next useful step requires investigation or implementation, I will define the scope before any paid work."
        q4: "Can we talk even if I do not have a defined project yet?"
        a4: "Absolutely. I am always open to an interesting technical conversation, especially around AI adoption, MCP, automation, architecture or a stubborn system problem."
