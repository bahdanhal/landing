    story:
        eyebrow: "BACKGROUND & JOURNEY"
        title: "From curiosity to production craftsmanship"
        p1: "My path in software development started with a deep fascination for how systems operate under real-world pressure. Over the past 5+ years, I have engineered telecommunications backends, scaled educational platforms serving over 2 million users, and delivered dozens of independent production systems."
        p2: "I believe that great engineering is about clarity and simplicity: writing code that is straightforward to maintain, building automated deployment pipelines that never fail on release day, and adopting AI tools where they eliminate actual human friction."
    philosophy:
        eyebrow: "CORE PRINCIPLES"
        title: "Engineering philosophy"
        item1_number: "01"
        item1_title: "No framework theater"
        item1_text: "Technology serves the business and the end user. I choose proven, high-performance tools based on reliability and maintainability, avoiding unnecessary dependencies and trend cycles."
        item2_number: "02"
        item2_title: "End-to-end ownership"
        item2_text: "From database schema design and business domain models to Docker containerization, reverse proxies, and production monitoring - I take full responsibility for delivery."
        item3_number: "03"
        item3_title: "Pragmatic AI adoption"
        item3_text: "AI is a powerful accelerator when integrated deeply into business workflows (LLM APIs, MCP servers, smart extraction), not just a cosmetic feature."
    ecosystem:
        eyebrow: "ECOSYSTEM & PRODUCTS"
        title: "Products built and operated independently"
        intro: "Live production platforms where I own the product vision, software architecture, infrastructure, and day-to-day operations."
        visit: "Visit project"
