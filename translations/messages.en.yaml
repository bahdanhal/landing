about:
    meta:
        title: "Bahdan Hal · Web & Backend Engineer - Gdańsk, Poland"
        description: "Personal story, engineering philosophy, and ecosystem products of Bahdan Hal. Senior backend engineer specializing in Symfony, Laravel, Linux, and AI integrations."
    role_short: "Backend & Systems Engineer"
    eyebrow: "ENGINEER · CREATOR · BUILDER"
    heading: "Crafting reliable web systems"
    heading_emphasis: "from idea to production."
    intro: "I am Bahdan Hal, a backend and systems engineer based in Gdańsk, Poland. I design resilient backend platforms, modernize high-load web systems, and build practical AI integrations that deliver real business impact."
