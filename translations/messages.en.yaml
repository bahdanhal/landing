vat:
    meta:
        title: "Polish VAT Calculator 2026 · Net to Gross and Gross to Net"
        description: "Calculate Polish VAT from net to gross or gross to net with 23%, 8%, 5% and 0% rates. Simulate a clearly labelled proposed future rate and start date."
    eyebrow: "POLAND · VAT · 2026"
    heading: "Net / gross VAT calculator"
    lede: "Convert an invoice amount in either direction. The calculator uses grosz-level rounding, runs entirely in your browser, and keeps future assumptions visibly separate from current law."
    verified: "Rules checked"
    amount: "Amount"
    direction:
        label: "Calculate from"
        net_to_gross: "Net → gross"
        gross_to_net: "Gross → net"
    rate: "VAT rate"
    exempt: "Exempt (zw.)"
    scenario:
        label: "Rules scenario"
        current: "Current Polish rates"
        future: "Simulate a proposed future rate"
        current_note: "Current-rate calculation. Standard Polish VAT rates available here are 23%, 8%, 5%, and 0%."
        future_note: "Future simulation — this assumed rate is not law. Verify the proposal and effective date before using it commercially."
    future:
        rate: "Assumed future rate"
        date: "Estimated start date"
        warning: "Planning scenario only. The entered rate and date are your assumptions, not a prediction or tax advice."
    result:
        net: "Net"
        tax: "VAT"
        gross: "Gross"
    copy: "Copy result"
    copied: "Copied"
    how:
        title: "How the calculation works"
        text: "For net amounts, VAT is added to the base. For gross amounts, the tax included in the total is extracted using the official relationship between the gross value and the rate. Each monetary result is rounded to two decimal places."
        gross_formula: "gross = net + round(net × rate / 100)"
        net_formula: "VAT from gross = round(gross × rate / (100 + rate))"
    source_intro: "Formula and rate reference:"
    future_info:
        title: "Future-change mode"
        text: "Because tax proposals can change or fail, the simulator makes you provide both the assumed rate and expected start date. That prevents an unconfirmed proposal from silently replacing current law."
        vida: "The government’s VAT in the Digital Age implementation is expected principally from 1 January 2027, but it concerns VAT administration rather than a general headline-rate change."
        source: "Official proposal UC147"
        no_rate_change: "No verified general 23% → new-rate proposal is preloaded as of 21 August 2026."
    faq:
        title: "Questions"
        q1: "What VAT rates does the calculator support?"
        a1: "It supports the commonly used 23%, 8%, 5%, and 0% Polish rates, plus exempt sales. The correct rate depends on the specific goods or services."
        q2: "Is a 0% rate the same as VAT exemption?"
        a2: "No. Both produce zero VAT in this arithmetic, but their legal treatment and deduction rights differ. The calculator keeps them as separate choices."
        q3: "Can I calculate a proposed future rate?"
        a3: "Yes. Choose the future scenario, enter the proposed percentage and an estimated start date. The result remains clearly marked as a simulation."
    disclaimer: "Informational calculator, not tax advice. Confirm the applicable rate, classification, rounding method, and effective date with official guidance or a qualified adviser."
    schema_name: "Polish net and gross VAT calculator"

