services_page:
    meta:
        title: "Bahdan Hal · Web Development, E-Commerce & AI Integration Services"
        description: "Commercial web development services: custom websites, online stores, client portals, AI & MCP integrations, automations, and technical audits in Poland and EU."
    eyebrow: "COMMERCIAL SERVICES & SOLUTIONS"
    heading: "Full-cycle web development"
    heading_emphasis: "engineered for business results."
    intro: "I build fast websites, launch online stores, create custom web applications, and integrate AI to automate manual business processes. Direct communication with a senior engineer from first estimate to production release."
    cta_consultation: "Request a Free Quote"
    cta_process: "How It Works"
    offerings_eyebrow: "WHAT I DELIVER"
    offerings_title: "Tailored engineering services"
    offerings_intro: "Every solution is built cleanly, documented, tested, and handed over with complete ownership."
    s1:
        number: "01"
        tag: "Speed & Conversions"
        title: "Turnkey Websites & High-Performance Landing Pages"
        problem: "Slow, fragile WordPress themes with dozens of plugins that break on updates, load in 4+ seconds, and suffer from poor Google SEO ranking."
        solution: "Custom-crafted, lightning-fast bilingual websites built with semantic HTML/CSS, robust backend, automated SSL, and perfect 95-100 Google Lighthouse scores."
        deliverables: "Mobile-first responsive design, SEO meta & structured data, fast contact forms, Caddy/Nginx hosting setup, Google Search Console integration."
        ideal_for: "B2B companies, consulting firms, agencies, and service businesses needing a trustworthy online presence."
    s2:
        number: "02"
        tag: "Sales & Payments"
        title: "E-Commerce & Online Stores"
        problem: "Losing customers due to complicated checkout flows, slow loading carts, or difficulty integrating Polish and international payment methods."
        solution: "High-converting online shops and product portals with seamless integrations for Polish and global payment gateways, shipping couriers, and automatic invoicing."
        deliverables: "Product catalogs, cart & checkout, PayU, BLIK, Przelewy24, Stripe, InPost Paczkomaty integration, automated email receipts, admin sales dashboard."
        ideal_for: "Brands and retailers launching or migrating direct-to-consumer (D2C) or B2B sales channels."
    s3:
        number: "03"
        tag: "Internal Tools & Portals"
        title: "Client Portals, Dashboards & Custom Web Apps"
        problem: "Managing business operations in messy Excel spreadsheets, lacking a central customer portal, or paying hefty monthly fees for rigid SaaS tools."
        solution: "Bespoke web applications, customer self-service portals, and secure role-based admin panels tailored precisely to your company workflows."
        deliverables: "User accounts & permission roles, interactive charts, PDF report generation, data import/export, background queue processing."
        ideal_for: "Growing companies looking to digitize proprietary business processes and save hundreds of employee hours."
    s4:
        number: "04"
        tag: "AI & Intelligence"
        title: "AI Integrations & Custom MCP Tools"
        problem: "Employees spending hours manually classifying documents, answering repetitive support queries, or summarizing data."
        solution: "Embedding modern LLMs (OpenAI, Claude, Gemini) and Model Context Protocol (MCP) servers directly into your software for intelligent automation."
        deliverables: "Custom AI assistants, automated invoice & PDF parsing, intelligent search over company knowledge bases, MCP endpoints connecting AI to internal databases."
        ideal_for: "Businesses wanting to harness AI productively without bloated generic subscriptions."
    s5:
        number: "05"
        tag: "Efficiency & Synchronization"
        title: "Process Automation & API Integrations"
        problem: "Disjointed tools requiring manual double-entry between CRM, email newsletters, accounting software, and warehouse systems."
        solution: "Robust background data synchronization pipelines, webhook handlers, and automated workflows that keep all your tools in sync 24/7."
        deliverables: "REST/GraphQL API bridges, CRM synchronization (HubSpot, Pipedrive, etc.), automated email/SMS alerts, custom data scraping pipelines."
        ideal_for: "Companies wanting seamless data flow between third-party systems with zero manual copying."
    s6:
        number: "06"
        tag: "Stability & Security"
        title: "Technical Audits, Speed Optimization & Production Rescue"
        problem: "Frequent server downtime, slow database queries, security vulnerabilities, or an abandoned codebase nobody dares to touch."
        solution: "Comprehensive technical audit, database index tuning, Linux/Docker security hardening, PHP version upgrades, and emergency production fixes."
        deliverables: "Actionable audit report with priority checklist, query speed improvements, PHP 8.x upgrades, automated daily backups, DMARC/SPF email fixes."
        ideal_for: "Existing web applications needing stability, speed improvements, or a safe modernization plan."
    process_eyebrow: "TRANSPARENT PROCESS"
    process_title: "How we work together"
    process_intro: "A predictable, transparent 4-step workflow from initial problem definition to post-launch guarantee."
    p1_step: "01"
    p1_title: "Discovery & Clear Scope"
    p1_text: "We discuss your exact business goals and requirements directly (no sales middlemen). We identify potential edge cases and agree on deliverables."
    p2_step: "02"
    p2_title: "Architecture & Fixed Estimate"
    p2_text: "You receive a clear technical plan, transparent price estimate, and milestone deadlines. You know exactly what will be delivered and when."
    p3_step: "03"
    p3_title: "Milestone Delivery & Demos"
    p3_text: "Development proceeds in clear milestones with interactive staging previews. You see real working software and can provide feedback early."
    p4_step: "04"
    p4_title: "Production Launch & Warranty"
    p4_text: "Zero-downtime deployment, DNS/SSL setup, analytics, and a 30-day post-launch warranty with ongoing support options."
    testimonials_eyebrow: "PROVEN TRACK RECORD"
    testimonials_title: "Trusted by clients worldwide"
    testimonials_link: "View verified Upwork profile"
    faq_eyebrow: "COMMON QUESTIONS"
    faq_title: "Frequently asked questions about services"
    faq:
        q1: "How long does a typical project take to complete?"
        a1: "A custom high-performance website or landing page typically takes 1 to 2 weeks. Custom web applications, e-commerce platforms, or AI integrations take 3 to 6 weeks depending on scope. Clear milestone dates are established before work begins."
        q2: "What are your payment terms and invoicing?"
        a2: "Projects are structured around milestones (typically 30-50% upfront, remainder upon final demo and deployment approval). Official B2B invoices (Faktura VAT / EU Reverse Charge) are issued with transparent payment terms."
        q3: "Do you provide post-launch maintenance and technical support?"
        a3: "Yes. Every completed project includes a 30-day warranty for any bugs or adjustments. For ongoing server monitoring, security updates, and incremental feature development, flexible monthly retainer packages are available."
        q4: "Can you take over or modernize an existing project?"
        a4: "Yes. I frequently audit, optimize, and modernize existing PHP (Symfony, Laravel, WordPress) codebases and legacy applications, fixing performance bottlenecks without risky full rewrites."
    consultation_eyebrow: "GET STARTED"
    consultation_title: "Let's discuss your project"
    consultation_text: "Send a brief message with your project goals or the technical issue you're facing. I will review it and reply within 24 hours with an initial technical assessment and next steps."
    consultation_point1: "Direct technical evaluation - no sales push."
    consultation_point2: "Free initial scoping and architecture advice."
    consultation_point3: "Transparent, fixed-price or milestone quotes."
    consultation_point4: "Honest feedback if another solution is a better fit."
