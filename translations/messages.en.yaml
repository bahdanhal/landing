geo:
    meta:
        title: "Free GEO Readiness Audit · Generative Engine Optimization"
        description: "Audit a page for generative engine readiness using transparent checks for access, direct answers, structure, schema, provenance, citations and entity clarity."
    eyebrow: "GENERATIVE ENGINE OPTIMIZATION"
    heading_start: "Can answer engines"
    heading_emphasis: "understand and cite you?"
    lede: "Inspect one page for the technical and editorial signals that make content easier to retrieve, interpret, attribute, and quote. Every point is tied to visible evidence—not a promise of AI visibility."
    form:
        label: "Page URL"
        submit: "Run GEO audit"
        loading: "Analysing…"
        note: "One page · Cached for six hours · Shares the 10 daily crawl-audit allowance · No ranking guarantee."
    limit:
        title: "Need another audit?"
        text: "Leave your email privately on this server and Bahdan can follow up."
    features:
        access:
            title: "Retrieval"
            text: "HTTP status, indexability, canonical URL, language and crawler controls."
        answer:
            title: "Answerability"
            text: "Direct opening answers, useful headings, lists, tables and question coverage."
        trust:
            title: "Attribution"
            text: "Structured data, author and publisher signals, dates, citations and entity identity."
    method:
        title: "What this score means"
        text: "GEO has no universal standard and no tool can confirm inclusion in a generated answer. This audit measures observable readiness signals that also improve accessibility and content clarity. AI-crawler choices are reported separately and never penalized."
    report:
        title: "GEO readiness report"
        new: "New GEO audit"
        cached: "CACHED REPORT"
        complete: "AUDIT COMPLETE"
        generated: "Generated"
        refresh: "Refresh analysis"
        score: "GEO readiness"
        passed: "checks passed"
        partial: "partially met"
        failed: "missing"
        schema_types: "schema types"
        checks: "Evidence-based checks"
        explain: "Open a check to see its evidence"
    status:
        pass: "Pass"
        warning: "Partial"
        fail: "Missing"
    check:
        access:
            title: "The page returns HTTP 200"
            help: "Answer engines need a stable, successful HTML response before they can process the content."
        indexability:
            title: "Search retrieval is permitted"
            help: "The page should not be blocked by robots.txt or noindex directives when public discovery is intended."
        canonical:
            title: "The canonical identifies this page"
            help: "A self-referencing canonical helps consolidate the page’s identity and avoid ambiguous URL variants."
        metadata:
            title: "Title, description and H1 are explicit"
            help: "Clear primary metadata gives retrieval systems a compact description of the page and its subject."
        language:
            title: "Document language is declared"
            help: "A valid HTML lang attribute helps systems select and interpret the correct language."
        direct_answer:
            title: "The opening provides a concise answer"
            help: "A focused first paragraph makes the central answer easier to extract without forcing a model to reconstruct it from the entire page."
        structure:
            title: "The content has useful semantic structure"
            help: "Main/article landmarks, descriptive subheadings, paragraphs, lists and tables make sections easier to retrieve independently."
        schema:
            title: "Structured data describes content and entities"
            help: "Valid JSON-LD can disambiguate the page type, publisher, author and other named entities. It supports understanding but does not guarantee citation."
        provenance:
            title: "Authorship, publisher and dates are attributable"
            help: "Named responsibility and publication history make claims easier to evaluate and attribute."
        citations:
            title: "Claims can point to external sources"
            help: "Relevant outbound references provide a visible evidence trail. Link count is only a proxy; source quality still requires human review."
        faq:
            title: "Important questions receive explicit answers"
            help: "Question-led sections can align well with conversational retrieval when they add real information rather than repetitive SEO text."
        freshness:
            title: "Publication or update date is machine-readable"
            help: "A datePublished/dateModified property or time element helps systems judge whether information may still be current."
        entity:
            title: "The publisher or author has a clear identity"
            help: "Entity schema, site naming and About/Contact paths help connect the content to a responsible person or organization."
    crawlers:
        title: "Published AI crawler controls"
        not_scored: "Policy visibility · not scored"
        intro: "This is a simplified reading of robots.txt for named agents. Training, search retrieval and user-triggered browsing can use different controls."
        blocked: "Blocked at /"
        allowed: "Explicitly allowed"
        not-addressed: "No specific rule"
        present: "Present"
        absent: "Not found"
        caveat: "llms.txt is an experimental convention, not an official requirement of major answer engines. A robots.txt permission does not mean a service will crawl or cite the page, and blocking a training crawler may be an intentional choice."
    next:
        title: "Best order of work"
        one: "Fix failed retrieval and indexability checks first."
        two: "Make the core answer, author, date and supporting sources unmistakable on the page."
        three: "Add accurate structured data that matches visible content, then monitor real referrals and citations rather than relying on this score alone."

