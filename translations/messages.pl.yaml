    story:
        eyebrow: "TŁO I DROGA ZAWODOWA"
        title: "Od ciekawości do rzemiosła produkcyjnego"
        p1: "Programowanie zaczęło się dla mnie od ciekawości, jak systemy zachowują się pod obciążeniem. Przez ponad 5 lat rozwijałem backendy telekomunikacyjne i skalowałem platformy edukacyjne dla ponad 2 milionów użytkowników. Wdrożyłem dziesiątki rozwiązań produkcyjnych."
        p2: "Wierzę w pragmatyzm zamiast mody: pisanie kodu, który łatwo zrozumieć i utrzymać, automatyzację wdrożeń bez stresu na produkcji oraz narzędzia AI tam, gdzie naprawdę oszczędzają czas i eliminują ludzką rutynę."
    philosophy:
        eyebrow: "ZASADY INŻYNIERSKIE"
        title: "Podejście do tworzenia oprogramowania"
        item1_number: "01"
        item1_title: "Bez teatru frameworków"
        item1_text: "Technologia ma służyć biznesowi i użytkownikom. Wybieram sprawdzone, wydajne narzędzia na podstawie niezawodności i łatwości utrzymania, unikając niepotrzebnych zależności."
        item2_number: "02"
        item2_title: "Pełna odpowiedzialność od początku do końca"
        item2_text: "Od schematu bazy danych i logiki domenowej po kontenery Dockera, konfigurację Caddy i nocną diagnostykę produkcji - biorę pełną odpowiedzialność za wdrożenie."
        item3_number: "03"
        item3_title: "Pragmatyczne wdrożenia AI"
        item3_text: "Sztuczna inteligencja to potężne narzędzie, gdy jest dobrze zintegrowana z procesami firmy (API LLM, serwery MCP, ekstrakcja danych), a nie tylko doklejonym dodatkiem."
    ecosystem:
