    intro: "Nazywam się Bahdan Hal. Jestem inżynierem backendu i systemów. Na co dzień działam w Trójmieście. Projektuję odporne platformy backendowe, modernizuję systemy o wysokim obciążeniu i wdrażam praktyczne integracje AI dające realną wartość biznesową."
