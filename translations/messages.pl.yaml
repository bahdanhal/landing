vat:
  meta:
    title: "Kalkulator VAT 2026 · Netto brutto i brutto netto"
    description: "Oblicz polski VAT netto-brutto lub brutto-netto dla stawek 23%, 8%, 5% i 0%. Zasymuluj planowaną przyszłą stawkę z datą wejścia."
  eyebrow: "POLSKA · VAT · 2026"
  heading: "Kalkulator VAT netto / brutto"
  lede: "Przelicz kwotę faktury w obu kierunkach. Kalkulator zaokrągla do groszy, działa wyłącznie w przeglądarce i wyraźnie oddziela przyszłe założenia od obowiązujących przepisów."
  verified: "Przepisy sprawdzone"
  amount: "Kwota"
  direction:
    label: "Kierunek obliczeń"
    net_to_gross: "Netto → brutto"
    gross_to_net: "Brutto → netto"
  rate: "Stawka VAT"
  exempt: "Zwolnione (zw.)"
  scenario:
    label: "Scenariusz przepisów"
    current: "Aktualne polskie stawki"
    future: "Symulacja proponowanej przyszłej stawki"
    current_note: "Obliczenie według aktualnych stawek. Dostępne podstawowe polskie stawki VAT: 23%, 8%, 5% i 0%."
    future_note: "Symulacja przyszłości — przyjęta stawka nie jest prawem. Przed użyciem biznesowym sprawdź projekt i datę wejścia w życie."
  future:
    rate: "Zakładana przyszła stawka"
    date: "Szacowana data wejścia"
    warning: "To wyłącznie scenariusz planistyczny. Podana stawka i data są Twoimi założeniami, a nie prognozą ani poradą podatkową."
  result:
    net: "Netto"
    tax: "VAT"
    gross: "Brutto"
  copy: "Kopiuj wynik"
  copied: "Skopiowano"
  how:
    title: "Jak działa obliczenie"
    text: "Dla kwoty netto podatek jest dodawany do podstawy. Z kwoty brutto podatek zawarty w sumie jest wyodrębniany według oficjalnej zależności między wartością brutto a stawką. Każdy wynik pieniężny jest zaokrąglany do dwóch miejsc."
    gross_formula: "brutto = netto + zaokrąglij(netto × stawka / 100)"
    net_formula: "VAT z brutto = zaokrąglij(brutto × stawka / (100 + stawka))"
  source_intro: "Źródło wzoru i stawek:"
  future_info:
    title: "Tryb przyszłych zmian"
    text: "Projekty podatkowe mogą się zmienić albo nie wejść w życie, dlatego symulator wymaga podania zakładanej stawki i oczekiwanej daty. Niepotwierdzony projekt nie zastąpi po cichu aktualnych zasad."
    vida: "Rządowy projekt wdrażający VAT in the Digital Age ma obowiązywać zasadniczo od 1 stycznia 2027 r., ale dotyczy administracji VAT, a nie ogólnej zmiany podstawowej stawki."
    source: "Oficjalny projekt UC147"
    no_rate_change: "Na 21 sierpnia 2026 r. nie wczytano żadnego potwierdzonego projektu ogólnej zmiany stawki 23%."
  faq:
    title: "Pytania"
    q1: "Jakie stawki VAT obsługuje kalkulator?"
    a1: "Obsługuje powszechnie stosowane polskie stawki 23%, 8%, 5% i 0% oraz sprzedaż zwolnioną. Właściwa stawka zależy od konkretnych towarów lub usług."
    q2: "Czy stawka 0% oznacza to samo co zwolnienie z VAT?"
    a2: "Nie. W tym obliczeniu oba warianty dają VAT równy zero, ale różnią się skutkami prawnymi i prawem do odliczenia. Dlatego są osobnymi opcjami."
    q3: "Czy mogę obliczyć proponowaną przyszłą stawkę?"
    a3: "Tak. Wybierz scenariusz przyszły, wpisz proponowany procent i szacowaną datę wejścia. Wynik pozostanie jednoznacznie oznaczony jako symulacja."
  disclaimer: "Kalkulator informacyjny, nie porada podatkowa. Potwierdź właściwą stawkę, klasyfikację, sposób zaokrąglenia i datę obowiązywania w oficjalnych źródłach lub u doradcy."
  schema_name: "Polski kalkulator VAT netto brutto"

