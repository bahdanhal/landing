profile:
    meta:
        title: "Bahdan Hal · Strony, integracje AI, MCP i wsparcie produkcji"
        description: "Strony, integracje AI, serwery MCP i automatyzacja workflow pod klucz oraz systemy PHP, wsparcie produkcji i uczciwe konsultacje techniczne."
    role_short: "Web & Backend Engineer"
    nav:
        services: "Usługi"
        work: "Realizacje"
    eyebrow: "OBECNOŚĆ ONLINE · SYSTEMY · PRODUKCJA"
    heading: "Systemy webowe"
    heading_emphasis: "gotowe na produkcję."
    intro: "Projektuję, modernizuję i utrzymuję systemy webowe — od konkretnych wdrożeń i integracji AI po trudne migracje backendu i incydenty produkcyjne. Otrzymujesz bezpośrednią ocenę techniczną i odpowiedzialność za realizację."
    scope: "Buduję i biorę odpowiedzialność za systemy online od początku do końca: strony, integracje oraz narzędzia oparte na AI i MCP — od pierwszej uczciwej decyzji technicznej przez wdrożenie i monitoring aż po dziwną awarię, której nikt nie potrafi odtworzyć."
    contact: "Bezpłatna konsultacja"
    resume:
        download: "Pobierz CV"
        consent: "Wyrażam zgodę na przetwarzanie moich danych osobowych zawartych w CV w celu prowadzenia rekrutacji."
    tools: "Otwórz toolbox"
    facts_label: "Podsumowanie zawodowe"
    years: "lat w branży"
    backend:
        title: "Systemy backendowe"
        text: "Aplikacje Symfony i Laravel, migracje legacy, procesy oparte na danych, API, integracje, kolejki i cała mało efektowna praca nad niezawodnością."
    infrastructure:
        title: "Praktyczna infrastruktura"
        text: "Docker, hardening Linuksa, migracje na opłacalne VPS-y i bare metal, dostarczalność poczty, usuwanie skutków incydentów i diagnostyka produkcji."
    ai:
        title: "AI, MCP i narzędzia pod klucz"
        text: "Integracje AI, serwery MCP, API, narzędzia wewnętrzne i automatyzacja workflow zaprojektowane wokół realnej pracy. Sam aktywnie ich używam i je testuję, więc doradzam z praktyki, nie tylko z prezentacji."
    services:
        eyebrow: "CO MOGĘ WZIĄĆ NA SIEBIE"
        title: "Jedna osoba na całą drogę techniczną"
        intro: "Mogę dowieźć konkretny projekt, dołączyć do istniejącego zespołu albo zbadać jeden uparty problem. Dostajesz bezpośrednią opinię, jasne kompromisy i człowieka, który zostaje na produkcji."
        presence:
            title: "Obecność w internecie"
            text: "Szybka dwujęzyczna strona, landing, portal usługowy albo praktyczne narzędzie razem z domeną, pocztą, decyzjami analitycznymi, podstawami SEO i wdrożeniem."
        delivery:
            title: "Realizacja od początku do końca"
            text: "Rozpoznanie, architektura, backend, integracje, infrastruktura, publikacja i przekazanie. Bez luki między „feature gotowy” a „działa dla prawdziwych użytkowników”."
        ai_integration:
            title: "Integracje AI i serwery MCP"
            text: "Dobór modeli, bezpieczny dostęp do narzędzi, retrieval, structured outputs, serwery MCP, workflow agentowe, ewaluacja i obserwowalność — w istniejącym produkcie albo nowym narzędziu."
        automation:
            title: "Automatyzacja workflow i wdrożenie w zespole"
            text: "Rozpisuję powtarzalną pracę, prototypuję użyteczny fragment, łączę systemy i pomagam zespołowi z tego korzystać. Doradzę, co automatyzować, co zostawić człowiekowi i jak sprawdzać wynik."
        duty:
            title: "Nocna migracja albo deployment"
            text: "Ostrożne przełączenia, migracje danych, plan wycofania i obecność na produkcji, kiedy najbezpieczniejsze okno wypada w środku nocy."
        investigation:
            title: "Skandale, intrygi, śledztwa"
            text: "Strona laguje we wtorki o losowej minucie między 12:00 a 12:10, kod wygląda niewinnie, a użytecznych logów brak? Dodam obserwowalność, odtworzę problem i pójdę za dowodami."
        legacy:
            title: "Legacy, aktualizacje i przyspieszenia"
            text: "Aktualizacje frameworka i PHP, naprawa zależności, testy wokół ryzykownego kodu, tuning bazy i cache oraz stopniowa modernizacja bez lekkomyślnego rewrite’u."
        audit:
            title: "Audyt z human touch"
            text: "Architektura, niezawodność, bezpieczeństwo, wydajność, SEO i infrastruktura ocenione w kontekście. Dostajesz uczciwą opinię i kolejność działań, nie ceremonialny PDF."
    work:
        eyebrow: "WYBRANE DOŚWIADCZENIE"
        title: "Ostatnie projekty"
        freedom: "Backend i wewnętrzne narzędzia agentowe dla platformy telekomunikacyjnej: integracje, stabilność i trudne błędy produkcyjne."
        gwo: "Modernizacja systemów Symfony i Laravel używanych przez miliony osób, narzędzia redakcyjne i edukacyjne oraz integracje modeli generatywnych i wizyjnych."
        consulting_title: "Niezależny konsulting"
        consulting: "Bezpieczeństwo Linuksa, migracje, dostarczalność SMTP, integracje API i konkretne prace backendowe dla klientów z realnymi systemami i rozsądnymi budżetami."
