services_page:
    meta:
        title: "Bahdan Hal · Tworzenie stron, sklepów internetowych i integracje AI"
        description: "Kompleksowe usługi programistyczne: szybkie strony www, sklepy online, aplikacje dedykowane, integracje AI/MCP, automatyzacja i audyty techniczne w Trójmieście i całej Polsce."
    eyebrow: "USŁUGI DLA BIZNESU I FIRM"
    heading: "Kompleksowy web development"
    heading_emphasis: "zorientowany na realne zyski."
    intro: "Tworzę szybkie strony internetowe, sklepy online, dedykowane panele dla firm oraz wdrażam AI do automatyzacji codziennej pracy. Bezpośredni kontakt z doświadczonym inżynierem od pierwszej wyceny po wdrożenie na serwer."
    cta_consultation: "Poproś o darmową wycenę"
    cta_process: "Jak pracujemy"
    offerings_eyebrow: "CO MOGĘ DLA CIEBIE ZROBIĆ"
    offerings_title: "Dedykowane usługi programistyczne"
    offerings_intro: "Każde rozwiązanie jest przejrzyste, przetestowane, udokumentowane i przekazane na własność."
    s1:
        number: "01"
        tag: "Szybkość i konwersja"
        title: "Strony internetowe i landing page pod klucz"
        problem: "Wolne, przestarzałe szablony WordPress z dziesiątkami wtyczek, które psują się przy aktualizacjach, ładują ponad 4 sekundy i tracą pozycje w Google."
        solution: "Szybkie, responsywne strony dwujęzyczne tworzone w czystym HTML/CSS i nowoczesnym backendzie, z automatycznym SSL i wynikami 95-100 w Google Lighthouse."
        deliverables: "Projekt mobile-first, metadane i schema SEO, bezpieczne formularze, hosting Caddy/Nginx, podpięcie Google Search Console."
        ideal_for: "Firm B2B, biur doradczych, agencji i przedsiębiorców potrzebujących profesjonalnej wizytówki budującej zaufanie."
    s2:
        number: "02"
        tag: "Sprzedaż i płatności"
        title: "Sklepy internetowe i e-Commerce"
        problem: "Utrata klientów przez skomplikowany koszyk, powolne działanie sklepu lub trudności z podpięciem polskich płatności i kurierów."
        solution: "Nowoczesne sklepy internetowe z pełną integracją płatności BLIK, PayU, Przelewy24, Stripe oraz automatyczną wysyłką do paczkomatów InPost."
        deliverables: "Katalog produktów, koszyk i checkout, bramki płatności (BLIK/PayU/Stripe), integracja InPost, automatyczne faktury i powiadomienia e-mail, panel sprzedaży."
        ideal_for: "Dla marek i sklepów uruchamiających bezpośrednią sprzedaż online (D2C) lub platform zamówień B2B."
    s3:
        number: "03"
        tag: "Narzędzia i panele"
        title: "Panele klienta, systemy CRM i aplikacje dedykowane"
        problem: "Prowadzenie firmy w chaotycznych arkuszach Excel, brak wygodnego panelu dla klientów lub drogie abonamenty za sztywne systemy SaaS."
        solution: "Dedykowane aplikacje webowe, portale samoobsługowe dla klientów i bezpieczne panele administracyjne dopasowane dokładnie do specyfiki Twojej firmy."
        deliverables: "Konta użytkowników i uprawnienia (RBAC), wykresy analityczne, generowanie raportów PDF, import/eksport danych, zadania w tle."
        ideal_for: "Rozwijających się firm chcących zautomatyzować unikalne procesy i zaoszczędzić setki godzin pracy zespołu."
    s4:
        number: "04"
        tag: "AI i inteligencja"
        title: "Integracje AI i dedykowane narzędzia MCP"
        problem: "Pracownicy marnujący czas na ręczne kategoryzowanie dokumentów, odpisywanie na powtarzalne pytania czy analizę długich tekstów."
        solution: "Wdrożenie modeli LLM (OpenAI, Claude, Gemini) oraz serwerów Model Context Protocol (MCP) bezpośrednio do Twojego systemu w celu inteligentnej automatyzacji."
        deliverables: "Asystenci AI, automatyczne przetwarzanie faktur i PDF-ów, inteligentne przeszukiwanie bazy wiedzy firmy, serwery MCP łączące AI z bazą danych."
        ideal_for: "Przedsiębiorstw chcących realnie wykorzystać AI w operacjach bez przepłacania za generyczne subskrypcje."
    s5:
        number: "05"
        tag: "Automatyzacja i integracja"
        title: "Automatyzacja procesów i integracje API"
        problem: "Niespójne systemy wymagające ręcznego przepisywania danych między CRM-em, newsletterem, programem magazynowym i księgowością."
        solution: "Stabilne potoki synchronizacji danych, obsługa webhooków i automatyczne przepływy zadań, które łączą wszystkie Twoje narzędzia w jeden ekosystem 24/7."
        deliverables: "Mosty API REST/GraphQL, synchronizacja z CRM (HubSpot, Pipedrive itp.), automatyczne powiadomienia e-mail/SMS, automatyczny parsing danych."
        ideal_for: "Firm szukających płynnego przepływu informacji między narzędziami bez ręcznej pracy."
    s6:
        number: "06"
        tag: "Stabilność i bezpieczeństwo"
        title: "Audyty techniczne, przyspieszanie stron i wsparcie produkcji"
        problem: "Częste awarie serwera, wolne zapytania w bazie, luki bezpieczeństwa lub stary kod, którego nikt w firmie nie potrafi zaktualizować."
        solution: "Kompleksowy audyt techniczny, optymalizacja indeksów bazy danych, zabezpieczenie serwera Linux/Docker, aktualizacja wersji PHP i usuwanie awarii."
        deliverables: "Raport audytu z listą priorytetów, optymalizacja zapytań SQL, bezpieczna aktualizacja PHP 8.x, automatyczne kopie zapasowe, konfiguracja DMARC/SPF."
        ideal_for: "Istniejących serwisów i aplikacji wymagających poprawy stabilności, szybkości lub bezpiecznej modernizacji."
    process_eyebrow: "PRZEJRZYSTY PROCES"
    process_title: "Jak wygląda współpraca"
    process_intro: "Przewidywalny, 4-etapowy model pracy od wstępnej analizy po gwarancję po wdrożeniu."
    p1_step: "01"
    p1_title: "Rozpoznanie i precyzyjny zakres"
    p1_text: "Rozmawiamy bezpośrednio o celach biznesowych i wymaganiach technicznych (bez pośredników). Określamy kluczowe funkcje i wykluczamy niespodzianki."
    p2_step: "02"
    p2_title: "Architektura i stała wycena"
    p2_text: "Otrzymujesz przejrzysty plan techniczny, stałą wycenę i harmonogram etapów. Wiesz dokładnie, co i kiedy zostanie dostarczone."
    p3_step: "03"
    p3_title: "Etapowa realizacja i demo"
    p3_text: "Prace przebiegają w przejrzystych etapach z podglądem na środowisku testowym (staging). Widzisz działające oprogramowanie i masz bieżący wpływ."
    p4_step: "04"
    p4_title: "Wdrożenie i gwarancja"
    p4_text: "Publikacja na serwerze produkcyjnym bez przerw w działaniu, konfiguracja domeny/SSL oraz 30-dniowa gwarancja z opcją stałego wsparcia."
    testimonials_eyebrow: "ZAUFANIE KLIENTÓW"
    testimonials_title: "Opinie i zweryfikowane realizacje"
    testimonials_link: "Zobacz profil na Upwork"
    faq_eyebrow: "PYTANIA I ODPOWIEDZI"
    faq_title: "Najczęściej zadawane pytania o usługi"
    faq:
        q1: "Ile trwa realizacja projektu?"
        a1: "Strona internetowa lub szybki landing page zwykle zajmuje od 1 do 2 tygodni. Dedykowana aplikacja, sklep internetowy lub integracja AI zajmuje od 3 do 6 tygodni, zależnie od zakresu. Harmonogram ustalamy przed rozpoczęciem prac."
        q2: "Jak wyglądają rozliczenia i umowa?"
        a2: "Pracujemy w oparciu o etapy (zazwyczaj 30-50% zaliczki, reszta po prezentacji i akceptacji wdrożenia). Wystawiam faktury VAT (B2B) z przejrzystymi warunkami płatności."
        q3: "Czy oferujesz wsparcie po wdrożeniu projektu?"
        a3: "Tak. Każdy projekt objęty jest 30-dniową bezpłatną gwarancją na poprawki. Dostępne są również elastyczne pakiety stałej opieki technicznej, monitoringu serwera i rozwoju nowych funkcji."
        q4: "Czy możesz przejąć lub zmodernizować istniejący projekt?"
        a4: "Tak. Regularnie audytuję, przyspieszam i modernizuję istniejące aplikacje PHP (Symfony, Laravel, WordPress), usuwając wąskie gardła wydajnościowe bez konieczności ryzykownego pisania wszystkiego od nowa."
    consultation_eyebrow: "ROZPOCZNIJMY PROJEKT"
    consultation_title: "Porozmawiajmy o Twoim projekcie"
    consultation_text: "Napisz krótką wiadomość z opisem celu lub problemu technicznego. Odpowiem w ciągu 24 godzin z wstępną oceną techniczną i propozycją dalszych kroków."
    consultation_point1: "Bezpośrednia rozmowa z inżynierem bez handlowego narzutu."
    consultation_point2: "Bezpłatna wstępna analiza i doradztwo architektoniczne."
    consultation_point3: "Przejrzysta, stała wycena etapów."
    consultation_point4: "Uczciwa opinia, jeśli prostsze rozwiązanie będzie lepsze."
